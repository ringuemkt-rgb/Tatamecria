[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurojitsu-analytics"
version = "0.1.0"
description = "Privacy-first multimodal analytics for adapted Brazilian Jiu-Jitsu research"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "Masatoshi Alan Nishiuchi dos Santos"}]
dependencies = [
  "jinja2>=3.1,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
dashboard = ["streamlit>=1.39,<2", "plotly>=5.24,<7"]
vision = [
  "mediapipe>=0.10.14,<0.11",
  "opencv-python-headless>=4.10,<5",
  "supervision>=0.27,<0.31",
]
tracking = ["trackers>=2,<3"]
physiology = ["neurokit2>=0.2.10,<0.3", "scipy>=1.13,<2"]
agents = ["smolagents>=1.22,<3", "transformers>=4.55,<6", "torch>=2.5,<3"]
wifi = ["websockets>=13,<16", "paho-mqtt>=2.1,<3"]
sqlcipher = ["sqlcipher3-binary>=0.5.4,<1; platform_system != 'Windows'"]
all = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "streamlit>=1.39,<2",
  "plotly>=5.24,<7",
  "mediapipe>=0.10.14,<0.11",
  "opencv-python-headless>=4.10,<5",
  "supervision>=0.27,<0.31",
  "trackers>=2,<3",
  "neurokit2>=0.2.10,<0.3",
  "scipy>=1.13,<2",
  "smolagents>=1.22,<3",
  "transformers>=4.55,<6",
  "torch>=2.5,<3",
  "websockets>=13,<16",
  "paho-mqtt>=2.1,<3",
]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "pandas-stubs>=2.2,<3",
  "types-PyYAML>=6,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
neurojitsu = "neurojitsu.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]
ignore = ["S101", "E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["neurojitsu"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
  "mediapipe.*",
  "supervision.*",
  "neurokit2.*",
  "streamlit.*",
  "transformers.*",
  "sqlcipher3.*",
]
ignore_missing_imports = true
