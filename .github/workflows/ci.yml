name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip --quiet
      - run: pip install --quiet -e ".[dev,api]"
      - run: ruff check src tests
      - name: Run mypy on minimum supported Python
        if: matrix.python-version == '3.11'
        id: mypy
        shell: bash
        run: |
          set +e
          mypy --no-pretty src/neurojitsu > mypy-output.txt 2>&1
          exit_code=$?
          cat mypy-output.txt
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload mypy diagnostics
        if: matrix.python-version == '3.11' && steps.mypy.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: mypy-${{ matrix.python-version }}
          path: mypy-output.txt
          retention-days: 7
      - name: Enforce mypy result
        if: matrix.python-version == '3.11' && steps.mypy.outputs.exit_code != '0'
        run: exit 1
      - run: pytest --cov=neurojitsu --cov-report=term-missing
