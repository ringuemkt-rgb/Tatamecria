name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip --quiet
      - run: pip install --quiet -e ".[dev,api]"
      - name: Lint
        run: ruff check src tests
      - name: Type check
        if: matrix.python-version == '3.11'
        run: mypy --no-pretty src/neurojitsu
      - name: Unit tests
        run: pytest --cov=neurojitsu --cov-report=term-missing
      - name: CLI verification
        run: neurojitsu verify
      - name: Synthetic end-to-end smoke test
        run: |
          rm -rf /tmp/neurojitsu-demo
          neurojitsu demo --output /tmp/neurojitsu-demo
          test -s /tmp/neurojitsu-demo/NJ-DEMO-001.json
          test -s /tmp/neurojitsu-demo/NJ-DEMO-001.html
          test -s /tmp/neurojitsu-demo/NJ-DEMO-001-agents.json
